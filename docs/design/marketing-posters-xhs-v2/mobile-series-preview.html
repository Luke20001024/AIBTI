<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>ArcBTI Mobile-first Poster Series V3</title>
    <style>
      @font-face { font-family: "Noto Sans SC"; src: url("file:///C:/Windows/Fonts/NotoSansSC-VF.ttf"); }
      @font-face { font-family: "Impact Local"; src: url("file:///C:/Windows/Fonts/impact.ttf"); }
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 560px; margin: 0; overflow: hidden; background: #151513; }
      body { color: #f1e6d1; font-family: "Noto Sans SC", sans-serif; }
      main { width: 1200px; height: 560px; padding: 24px 42px 22px; }
      header { height: 70px; border-bottom: 1px solid #555149; display: flex; align-items: start; justify-content: space-between; }
      h1 { margin: 0; font-size: 25px; line-height: 1; }
      p { margin: 7px 0 0; color: #a8a298; font-size: 11px; letter-spacing: .7px; }
      .meta { color: #e44a31; text-align: right; font: 14px/1 "Impact Local"; letter-spacing: 1.4px; }
      section { display: grid; grid-template-columns: repeat(3, 300px); justify-content: space-between; padding: 20px 48px 0; }
      figure { width: 300px; margin: 0; }
      img { display: block; width: 300px; height: 400px; object-fit: cover; box-shadow: 0 10px 26px rgba(0,0,0,.35); }
      figcaption { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; }
      strong { font-size: 14px; }
      span { color: #e44a31; font: 10px/1 "Impact Local"; letter-spacing: 1.2px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>ArcBTI · 三张海报手机信息流终检</h1><p>每张按约 300 × 400 显示；不点开时应直接读到一句主标题、一个人物世界和一个行动方向。</p></div>
        <div class="meta">MOBILE-FIRST SERIES<br />FINAL QA / V3</div>
      </header>
      <section>
        <figure>
          <img src="../../../public/images/campaign/xhs-posters-v2/02-whole-cast-ensemble-mobile-v3.png" />
          <figcaption><strong>全员到齐</strong><span>THE COMPLETE CAST</span></figcaption>
        </figure>
        <figure>
          <img src="../../../public/images/campaign/xhs-posters-v2/01-endless-type-scroll-mobile-v3.png" />
          <figcaption><strong>人格卷轴</strong><span>ENDLESS TYPE SCROLL</span></figcaption>
        </figure>
        <figure>
          <img src="../../../public/images/campaign/xhs-posters-v2/03-one-site-16-opinions-mobile-v3.png" />
          <figcaption><strong>同一块地，16种不服</strong><span>ONE SITE / 16 OPINIONS</span></figcaption>
        </figure>
      </section>
    </main>
    <script>window.__POSTER_READY__ = true;</script>
  </body>
</html>
