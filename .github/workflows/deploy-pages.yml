name: Deploy ArcBTI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCBTI_RELEASE_TARGET: web
      ARCBTI_OUTPUT_DIR: web-release/dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate domain and types
        run: pnpm typecheck && pnpm test

      - name: Install image build dependency
        run: python -m pip install Pillow==11.3.0

      - name: Build and validate the GitHub Pages web release
        run: |
          node xhs-mini-tool-v2/scripts/build.mjs
          node xhs-mini-tool-v2/scripts/validate.mjs

      - name: Install representative mobile browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Verify the packaged site in a mobile browser
        run: |
          node xhs-mini-tool-v2/scripts/offline-smoke.mjs
          node xhs-mini-tool-v2/scripts/web-mobile-qa.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web-release/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
