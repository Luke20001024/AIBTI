name: ArcBTI 留言与建议
description: 留下体验感受、资料勘误、显示问题或新的建筑人格点子
title: "[留言] "
body:
  - type: dropdown
    id: category
    attributes:
      label: 留言类型
      options:
        - 体验建议
        - 建筑或建筑师资料勘误
        - 手机显示与兼容性问题
        - 新人格或新建筑点子
        - 其他
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: 想对 ArcBTI 说什么？
      description: 请尽量具体；如涉及显示问题，可写明人格、设备和浏览器。
      placeholder: 在这里写下你的留言……
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: 相关页面或人格（可选）
      placeholder: 例如 TIDE、RUIN、首页或抽卡页

  - type: checkboxes
    id: privacy
    attributes:
      label: 公开留言确认
      description: GitHub Issue 是公开内容，请不要提交个人联系方式或其他敏感信息。
      options:
        - label: 我已确认留言中不包含敏感个人信息
          required: true
