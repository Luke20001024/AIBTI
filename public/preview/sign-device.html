<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SIGN · 390 × 844 手机验收视图</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        background: #d8d4ca;
        color: #111318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 438px;
        margin: 0;
        padding: 24px 24px 48px;
        background:
          linear-gradient(rgb(255 255 255 / 35%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 35%) 1px, transparent 1px),
          #d8d4ca;
        background-size: 24px 24px;
      }

      header {
        width: 414px;
        margin: 0 auto 14px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      p {
        color: #4f514f;
        font-size: 11px;
        line-height: 1.35;
        text-align: right;
      }

      .device {
        position: relative;
        width: 414px;
        margin: 0 auto;
        padding: 12px;
        border: 1px solid #111318;
        background: #111318;
        box-shadow: 0 24px 70px rgb(22 24 27 / 24%);
      }

      .device::before {
        content: "390 CSS px";
        position: absolute;
        top: -20px;
        left: 0;
        color: #111318;
        font: 700 10px/1 Arial, sans-serif;
        letter-spacing: 0.08em;
      }

      .viewport {
        display: block;
        width: 390px;
        height: 844px;
        overflow: hidden;
        background: #f3f0e7;
      }

      iframe {
        display: block;
        width: 405px;
        height: 844px;
        border: 0;
        background: #f3f0e7;
      }

      .height-label {
        position: absolute;
        top: 12px;
        right: -52px;
        height: 844px;
        display: grid;
        place-items: center;
        color: #111318;
        font: 700 10px/1 Arial, sans-serif;
        letter-spacing: 0.08em;
        writing-mode: vertical-rl;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SIGN 手机验收视图</h1>
      <p>iPhone 14 级视口<br />390 × 844 · 1:1 CSS px · 无缩放</p>
    </header>

    <main class="device" aria-label="390 × 844 手机页面演示框">
      <div class="viewport">
        <iframe src="/result/sign/?mine=1" title="SIGN 390 × 844 手机端实际页面"></iframe>
      </div>
      <span class="height-label" aria-hidden="true">844 CSS px</span>
    </main>
  </body>
</html>
